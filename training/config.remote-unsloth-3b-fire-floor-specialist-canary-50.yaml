backend: "unsloth"
# Tiny paid canary for the fire-only 3B floor specialist after route-to-egress fixes.
# This is intentionally not a submission run: it proves the reward path can save people
# before spending on 750/2000-step curricula.
max_steps: 50
unsloth_max_seq_length: 1024
load_in_4bit: true
model:
  base: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "bfloat16"
  max_prompt_tokens: 640
  max_completion_tokens: 96
roles:
  trainable: ["floor_agent"]
  orchestrator_policy: "stub"
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
rollout:
  episodes_per_step: 1
  max_rounds_per_episode: 4
  seed_retry_limit: 200
  use_vllm: false
  candidates_per_floor_prompt: 4
  include_oracle_floor_candidate: true
  sampling_temperature: 0.7
  disaster_families: ["fire"]
  tier_schedule:
    - steps: 50
      mix: {easy: 50}
grpo:
  learning_rate: 5.0e-6
  kl_coef: 0.04
  clip_range: 0.2
  num_train_epochs_per_step: 1
reward:
  rationale_scaling: "linear_capped"
  alpha: 0.01
  beta: 0.25
  cap: 1.0
  eligible_token_ceiling: 96
  clip_normalized_to: 1.0
eval:
  every_steps: 10
  tiers: ["easy"]
  seeds: [42, 123]
checkpoint:
  every_steps: 10
  keep_last_n: 6
  root_dir: "outputs/training/remote-unsloth-3b-fire-floor-specialist-canary-50"
metrics:
  csv_path: "outputs/training/remote-unsloth-3b-fire-floor-specialist-canary-50-metrics.csv"
  jsonl_dir: "outputs/logs/remote-unsloth-3b-fire-floor-specialist-canary-50"
seed:
  training_rng: 12345
