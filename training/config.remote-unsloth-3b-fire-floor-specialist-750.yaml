backend: "unsloth"
# Fire-only 750-step floor-specialist lane with replay-aware staged difficulty.
max_steps: 750
unsloth_max_seq_length: 2048
load_in_4bit: true
model:
  base: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "bfloat16"
  max_prompt_tokens: 1024
  max_completion_tokens: 128
roles:
  trainable: ["floor_agent"]
  orchestrator_policy: "stub"
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
rollout:
  episodes_per_step: 1
  max_rounds_per_episode: 4
  seed_retry_limit: 200
  use_vllm: false
  disaster_families: ["fire"]
  tier_schedule:
    - steps: 200
      mix: {easy: 200}
    - steps: 200
      mix: {medium: 160, easy: 40}
    - steps: 200
      mix: {hard: 160, medium: 30, easy: 10}
    - steps: 150
      mix: {brutal: 115, hard: 25, medium: 10}
grpo:
  learning_rate: 5.0e-6
  kl_coef: 0.04
  clip_range: 0.2
  num_train_epochs_per_step: 1
reward:
  rationale_scaling: "linear_capped"
  alpha: 0.01
  beta: 0.25
  cap: 1.0
  eligible_token_ceiling: 96
  clip_normalized_to: 1.0
eval:
  every_steps: 50
  tiers: ["easy", "medium", "hard", "brutal"]
  seeds: [42, 123]
checkpoint:
  every_steps: 25
  keep_last_n: 8
  root_dir: "outputs/training/remote-unsloth-3b-fire-floor-specialist-750"
metrics:
  csv_path: "outputs/training/remote-unsloth-3b-fire-floor-specialist-750-metrics.csv"
  jsonl_dir: "outputs/logs/remote-unsloth-3b-fire-floor-specialist-750"
seed:
  training_rng: 12345
