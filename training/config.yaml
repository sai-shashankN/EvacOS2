backend: "unsloth"
# Hard cap on GRPO steps. Leave unset to run until SIGTERM/Ctrl+C.
# max_steps: 100
unsloth_max_seq_length: 4096
load_in_4bit: true
model:
  base: "Qwen/Qwen2.5-3B-Instruct"
  # Leave role-specific overrides unset to preserve the current shared-model fast path.
  # Later, you can split roles without changing code structure:
  # orchestrator_base: "Qwen/Qwen2.5-7B-Instruct"
  # floor_base: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "bfloat16"
  max_prompt_tokens: 3500
  max_completion_tokens: 256
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
rollout:
  episodes_per_step: 4
  max_rounds_per_episode: 80
  seed_retry_limit: 1000
  use_vllm: true
  disaster_families: ["fire", "flood", "gas", "structural", "active_threat", "multi_cascade"]
grpo:
  learning_rate: 5.0e-6
  kl_coef: 0.04
  clip_range: 0.2
  num_train_epochs_per_step: 1
reward:
  rationale_scaling: "linear_capped"
  alpha: 0.01
  beta: 0.25
  cap: 1.0
  eligible_token_ceiling: 160
  clip_normalized_to: 1.0
eval:
  every_steps: 20
  tiers: ["easy", "medium"]
  seeds: [42, 123, 456, 789, 1024]
checkpoint:
  every_steps: 10
  keep_last_n: 5
  root_dir: "outputs/training/checkpoints"
metrics:
  csv_path: "outputs/training/metrics.csv"
  jsonl_dir: "outputs/logs"
seed:
  training_rng: 12345
# ------------------------------------------------------------------------
# Serious training default: Unsloth + vLLM on Linux/CUDA.
# If you need Windows-only local code/test work, override locally with:
#
# backend: "hf"
# rollout:
#   use_vllm: false
# ------------------------------------------------------------------------
