backend: "unsloth"
# Fire-only 300-step easy proof lane for the 3B floor specialist.
# Use after the 50-step canary proves parser/checkpoint/CSV health. This run is
# meant to prove held-out easy-fire learning before spending on harder curricula.
max_steps: 300
unsloth_max_seq_length: 1024
load_in_4bit: true
model:
  base: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "bfloat16"
  max_prompt_tokens: 640
  max_completion_tokens: 64
roles:
  trainable: ["floor_agent"]
  orchestrator_policy: "stub"
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
rollout:
  episodes_per_step: 1
  max_rounds_per_episode: 4
  seed_retry_limit: 200
  use_vllm: false
  disaster_families: ["fire"]
  tier_schedule:
    - steps: 300
      mix: {easy: 300}
grpo:
  learning_rate: 5.0e-6
  kl_coef: 0.04
  clip_range: 0.2
  num_train_epochs_per_step: 1
reward:
  rationale_scaling: "linear_capped"
  alpha: 0.01
  beta: 0.25
  cap: 1.0
  eligible_token_ceiling: 96
  clip_normalized_to: 1.0
eval:
  every_steps: 25
  tiers: ["easy"]
  seeds: [42, 123, 456, 789]
checkpoint:
  every_steps: 25
  keep_last_n: 8
  root_dir: "outputs/training/remote-unsloth-3b-fire-floor-specialist-easy-proof-300"
metrics:
  csv_path: "outputs/training/remote-unsloth-3b-fire-floor-specialist-easy-proof-300-metrics.csv"
  jsonl_dir: "outputs/logs/remote-unsloth-3b-fire-floor-specialist-easy-proof-300"
seed:
  training_rng: 12345
