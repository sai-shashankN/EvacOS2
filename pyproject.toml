[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evacos-ma"
version = "0.1.0"
description = "Hierarchical Multi-Agent Evacuation Environment (Round 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openenv-core>=0.2.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
eval = [
    "matplotlib>=3.8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "curriculum*",
    "dashboard*",
    "evaluation*",
    "evacos_ma*",
    "procgen*",
    "renderer*",
    "server*",
    "training*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]
