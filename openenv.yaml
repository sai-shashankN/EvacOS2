env_name: evacos-ma
version: 0.1.0
description: Hierarchical Multi-Agent Evacuation Environment (Round 2)
tasks:
  - task_id: task_1_fire_easy
    name: Single Fire Evacuation
    difficulty: easy
  - task_id: task_2_flood_medium
    name: Flood Rising Rooftop Evacuation
    difficulty: medium
  - task_id: task_3_earthquake_hard
    name: Post-Earthquake Structural Evacuation
    difficulty: hard
  - task_id: task_4_cascade_hard
    name: Multi-Hazard Cascade
    difficulty: brutal
  - task_id: task_lh_fire_easy
    name: Long-Horizon Fire Easy
    difficulty: easy
  - task_id: task_lh_flood_medium
    name: Long-Horizon Flood Medium
    difficulty: medium
  - task_id: task_lh_cascade_hard
    name: Long-Horizon Multi-Cascade Hard
    difficulty: hard
  - task_id: task_lh_cascade_brutal
    name: Long-Horizon Multi-Cascade Brutal
    difficulty: brutal
action_schema_ref: evacos_ma.schemas.multi_agent.ActionBundleMA
observation_schema_ref: evacos_ma.schemas.multi_agent.RoleObservationMA
debug_state_enabled: false
supported_tiers:
  - easy
  - medium
  - hard
  - brutal
agent_topology:
  orchestrator_count: 1
  floor_agent_count: 5
protocol:
  reset: /openenv/reset
  step: /openenv/step
  state: /openenv/state
  schema: /openenv/schema
  health: /openenv/health
  metadata: /openenv/metadata
