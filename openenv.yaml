env_name: evacos-ma
version: 0.1.0
description: Hierarchical Multi-Agent Evacuation Environment (Round 2)
tasks:
  - task_id: task_1_fire_easy
    name: Single Fire Evacuation
    difficulty: easy
  - task_id: task_lh_fire_easy
    name: Long-Horizon Fire
    difficulty: easy
action_schema_ref: evacos_ma.schemas.multi_agent.ActionBundleMA
observation_schema_ref: evacos_ma.schemas.multi_agent.RoleObservationMA
debug_state_enabled: false
supported_tiers:
  - easy
agent_topology:
  orchestrator_count: 1
  floor_agent_count: 5
protocol:
  reset: /openenv/reset
  step: /openenv/step
  state: /openenv/state
  schema: /openenv/schema
  health: /openenv/health
  metadata: /openenv/metadata
